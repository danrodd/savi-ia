[project]
name = "savi"
# La versión real es el tag de git (scripts/version.py). SAVI no se publica
# como paquete: este número no se usa y no hay que subirlo nunca.
version = "0.0.0"
description = "SAVI - Agente de IA corporativo de SEO Group"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    # Windows no trae base de datos de zonas horarias: sin esto `zoneinfo`
    # falla con ZoneInfoNotFoundError en cualquier equipo cliente.
    "tzdata>=2024.1",
    "pydantic>=2.10",
    # >=2.14.2 por CVE-2026-58203 (lectura de secretos desde directorio).
    "pydantic-settings>=2.14.2",
    # Pines de seguridad, no funcionales. `starlette` llega por FastAPI y
    # `cryptography` por el cifrado de credenciales del ERP; se declaran acá
    # para que el lock no vuelva a una versión vulnerable:
    # - starlette <1.3.1: límites de `request.form()` no aplicados y
    #   `request.url` mal reconstruida (SAVI recibe multipart).
    # - cryptography <50: OpenSSL vulnerable en la wheel, más pkcs7 y
    #   validación de cadenas.
    "starlette>=1.3.1",
    "cryptography>=50.0.0",
    "orjson>=3.10",
    "claude-agent-sdk>=0.0.10",
    "anthropic>=0.40",
    "google-genai==2.23.0",
    "sqlglot>=27",
    "pyjwt>=2.10",
    # Lo usa `app.tray` para el icono de la bandeja. Llegaba transitivo por
    # `mcp`, pero un import directo se declara: el día que esa cadena
    # cambie, SAVI arranca sin forma de cerrarse.
    "pywin32>=311; sys_platform == 'win32'",
    "openai==3.13.0",
    # Conocimiento de la empresa (documentos propios): extracción de PDF y
    # embeddings locales. `fastembed` trae `onnxruntime`, `numpy`,
    # `tokenizers` y `huggingface-hub`. Versiones fijas, como
    # `openai==3.13.0`: el runtime ONNX y el modelo viajan en el instalador
    # y cambian de comportamiento entre minors.
    "fastembed==0.8.0",
    "pypdf==6.18.1",
    # Subida `multipart/form-data` en FastAPI. Llegaba transitivo; se
    # declara porque el módulo de documentos depende de él directamente.
    # >=0.0.31 por PYSEC-2026-3036/3037/3040 (Content-Length negativo y `;`
    # como separador): justo el camino de la subida de documentos.
    "python-multipart>=0.0.31",
    # Llega transitivo por `claude-agent-sdk`. Se fija el piso por
    # PYSEC-2026-3481/3482/3483: afectan transportes SSE, HTTP y WebSocket que
    # SAVI no usa (monta el servidor MCP en proceso), pero no hay motivo para
    # quedarse abajo. Acotado a la línea 1.x: el salto a 2.x es mayor y
    # tocaría el SDK del agente, que es el corazón del chat.
    "mcp>=1.28.1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "pyinstaller>=6.21.0",
]

[project.scripts]
savi = "app.launcher:main"
dev = "app.cli:dev"
lint = "app.cli:lint"
fmt = "app.cli:fmt"
typecheck = "app.cli:typecheck"
migrate = "app.cli:migrate"
download-embedding-model = "app.cli:download_embedding_model"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Las migraciones de Alembic son archivos autogenerados; respetamos su
# formato (líneas largas con SQL inline). Editarlos a mano solo cuando
# realmente toca ajustar la migración.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "ASYNC"]
# B008: FastAPI usa Query(), Depends(), Path() en defaults por diseño.
ignore = ["B008"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["app", "tests"]
pythonVersion = "3.12"
reportMissingTypeStubs = false
# Decoradores de FastAPI (registro de rutas, handlers, lifespan) marcan
# funciones como no usadas aunque sí se invocan vía registry.
reportUnusedFunction = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
