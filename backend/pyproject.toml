[project]
name = "savi"
# La versión real es el tag de git (scripts/version.py). SAVI no se publica
# como paquete: este número no se usa y no hay que subirlo nunca.
version = "0.0.0"
description = "SAVI - Agente de IA corporativo de SEO Group"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    # Windows no trae base de datos de zonas horarias: sin esto `zoneinfo`
    # falla con ZoneInfoNotFoundError en cualquier equipo cliente.
    "tzdata>=2024.1",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "orjson>=3.10",
    "claude-agent-sdk>=0.0.10",
    "anthropic>=0.40",
    "google-genai==2.23.0",
    "sqlglot>=27",
    "pyjwt>=2.10",
    # Lo usa `app.tray` para el icono de la bandeja. Llegaba transitivo por
    # `mcp`, pero un import directo se declara: el día que esa cadena
    # cambie, SAVI arranca sin forma de cerrarse.
    "pywin32>=311; sys_platform == 'win32'",
    "openai==3.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "pyinstaller>=6.21.0",
]

[project.scripts]
savi = "app.launcher:main"
dev = "app.cli:dev"
lint = "app.cli:lint"
fmt = "app.cli:fmt"
typecheck = "app.cli:typecheck"
migrate = "app.cli:migrate"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Las migraciones de Alembic son archivos autogenerados; respetamos su
# formato (líneas largas con SQL inline). Editarlos a mano solo cuando
# realmente toca ajustar la migración.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "ASYNC"]
# B008: FastAPI usa Query(), Depends(), Path() en defaults por diseño.
ignore = ["B008"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["app", "tests"]
pythonVersion = "3.12"
reportMissingTypeStubs = false
# Decoradores de FastAPI (registro de rutas, handlers, lifespan) marcan
# funciones como no usadas aunque sí se invocan vía registry.
reportUnusedFunction = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
