# SAVI Master: SAVI + SAVI Cloud + PostgreSQL + Caddy (HTTPS automático con Let's Encrypt).
#
# Antes de levantar:   ./setup.sh
# Levantar / aplicar:  docker compose up -d --build
#
# Todos los secretos son archivos en ./secrets (los lee la aplicación por `*_FILE`): ninguno
# aparece en este archivo, en `.env` ni en `docker inspect`.

name: savi-master

services:
  caddy:
    image: caddy:${CADDY_VERSION}
    container_name: savi-master-caddy
    restart: unless-stopped
    depends_on:
      savi:
        condition: service_healthy
      cloud:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      SAVI_DOMAIN: ${SAVI_DOMAIN}
      CLOUD_DOMAIN: ${CLOUD_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"        # desafío HTTP-01 y redirección a HTTPS
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data       # certificados y cuenta ACME: persistirlos evita reemitir
      - ./data/caddy/config:/config
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE   # puertos 80 y 443

  savi:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args:
        APP_VERSION: ${SAVI_VERSION}
        APP_COMMIT: ${SAVI_COMMIT:-}
        APP_BUILT_AT: ${SAVI_BUILT_AT:-}
    image: savi-master/savi:${SAVI_VERSION}   # fijada por setup.sh desde el tag de git
    container_name: savi-master-savi
    restart: unless-stopped
    init: true   # el CLI de Claude es un subproceso por turno: hay que cosechar zombis
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      APP_ENV: production
      APP_DEBUG: "false"
      AGENT_DB_ENGINE: postgresql
      AGENT_DB_HOST: db
      AGENT_DB_PORT: "5432"
      AGENT_DB_USER: ${SAVI_DB_USER}
      AGENT_DB_NAME: ${SAVI_DB_NAME}
      AGENT_DB_PASSWORD_FILE: /run/secrets/savi_db_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      ERP_CREDENTIALS_KEY_FILE: /run/secrets/erp_credentials_key
      # Detrás de Caddy: la IP real llega en X-Forwarded-For. Es seguro porque el puerto de la
      # aplicación no se publica: solo Caddy puede hablarle.
      TRUST_PROXY_HEADERS: "true"
      # Mismo origen: sin CORS.
      CORS_ALLOWED_ORIGINS: ""
      SAVI_ADMIN_LOGINS: ${SAVI_ADMIN_LOGINS:-}
      # Segundo factor (TOTP): `admins` lo exige a los administradores de SAVI; `all` a todos;
      # `off` lo apaga. Expuesto a internet, `off` no es una opción razonable.
      MFA_ENFORCEMENT: ${SAVI_MFA_ENFORCEMENT:-admins}
      MFA_ISSUER: ${SAVI_MFA_ISSUER:-SAVI}
      # El CLI de Claude con la cuenta de cada persona solo existe en el SAVI local: acá
      # correría con la cuenta del servidor. Las claves del Master van como API key.
      LOCAL_CLI_ENABLED: "false"
      SAVI_CLOUD_URL: ${SAVI_CLOUD_URL:-}
    secrets:
      - savi_db_password
      - jwt_secret
      - erp_credentials_key
    volumes:
      - ./data/savi/data:/data          # datos y logs del servicio
      - ./data/savi/home:/home/savi     # HOME del CLI de Claude (configuración y sesiones)
    networks:
      - edge       # salida a internet: proveedores de IA, bases de ERP remotas, Cloud
      - backend
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # read_only: true  [VERIFICAR] el CLI de Claude escribe en $HOME en cada turno; con un
    # volumen para /home/savi y /data podría activarse tras probarlo bajo carga.

  cloud:
    build:
      context: ../../cloud
      dockerfile: backend/Dockerfile
    image: savi-master/cloud:${SAVI_VERSION}
    container_name: savi-master-cloud
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      CLOUD_ENV: production
      CLOUD_DB_HOST: db
      CLOUD_DB_USER: ${CLOUD_DB_USER}
      CLOUD_DB_NAME: ${CLOUD_DB_NAME}
      CLOUD_DB_PASSWORD_FILE: /run/secrets/cloud_db_password
      CLOUD_CONSOLE_SECRET_FILE: /run/secrets/cloud_console_secret
      CLOUD_LOG_LEVEL: ${CLOUD_LOG_LEVEL:-INFO}
      CLOUD_ENROLLMENT_TOKEN_TTL_HOURS: ${CLOUD_ENROLLMENT_TOKEN_TTL_HOURS:-72}
      CLOUD_LATEST_VERSION: ${CLOUD_LATEST_VERSION:-}
      CLOUD_LATEST_VERSION_PUBLISHED_AT: ${CLOUD_LATEST_VERSION_PUBLISHED_AT:-}
    secrets:
      - cloud_db_password
      - cloud_console_secret
    networks:
      - edge
      - backend
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  db:
    image: postgres:${POSTGRES_VERSION}
    container_name: savi-master-db
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_root_password
      # Variables y archivos que usa initdb/10-create-databases.sh (solo corre al crear el
      # volumen; después no vuelve a ejecutarse).
      SAVI_DB_USER: ${SAVI_DB_USER}
      SAVI_DB_NAME: ${SAVI_DB_NAME}
      SAVI_DB_PASSWORD_FILE: /run/secrets/savi_db_password
      CLOUD_DB_USER: ${CLOUD_DB_USER}
      CLOUD_DB_NAME: ${CLOUD_DB_NAME}
      CLOUD_DB_PASSWORD_FILE: /run/secrets/cloud_db_password
    secrets:
      - db_root_password
      - savi_db_password
      - cloud_db_password
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - backend    # solo red interna: el puerto de la base NO se publica
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    security_opt:
      - no-new-privileges:true

networks:
  edge:
    name: savi-master-edge
    driver: bridge
  backend:
    name: savi-master-backend
    driver: bridge
    internal: true   # sin salida a internet: la base de datos no tiene por qué hablar afuera

secrets:
  db_root_password:
    file: ./secrets/db_root_password.txt
  savi_db_password:
    file: ./secrets/savi_db_password.txt
  cloud_db_password:
    file: ./secrets/cloud_db_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  erp_credentials_key:
    file: ./secrets/erp_credentials_key.txt
  cloud_console_secret:
    file: ./secrets/cloud_console_secret.txt
