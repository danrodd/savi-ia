[project]
name = "savi-cloud"
# La versión real la fija el tag de despliegue; este número no se usa.
version = "0.0.0"
description = "SAVI Cloud - plataforma de vinculación, telemetría y consola de SAVI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "pydantic>=2.10",
    "pydantic-settings>=2.14.2",
    # Pin de seguridad (mismo piso que el backend de la instancia).
    "starlette>=1.3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "aiosqlite>=0.20",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "jsonschema>=4.26.0",
]

[project.scripts]
cloud-admin = "app.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "ASYNC"]
# N818: los errores de dominio se nombran por el hecho (ClientNotFound), sin sufijo Error.
ignore = ["B008", "N818"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["app", "tests"]
pythonVersion = "3.12"
reportMissingTypeStubs = false
reportUnusedFunction = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
