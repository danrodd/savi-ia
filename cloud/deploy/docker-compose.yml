# SAVI Cloud: API + Postgres + Caddy (HTTPS automático) + backup diario.
# Uso: cp .env.example .env  (completar)  &&  docker compose up -d
name: savi-cloud

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: savi_cloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD en .env}
      POSTGRES_DB: savi_cloud
    volumes:
      - db_data:/var/lib/postgresql/data
    # Sin `ports`: Postgres solo es alcanzable desde la red interna de Compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savi_cloud -d savi_cloud"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: savi-cloud-api:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      CLOUD_ENV: production
      CLOUD_DATABASE_URL: postgresql+asyncpg://savi_cloud:${POSTGRES_PASSWORD}@db:5432/savi_cloud
      CLOUD_LOG_LEVEL: ${CLOUD_LOG_LEVEL:-INFO}
      CLOUD_ENROLLMENT_TOKEN_TTL_HOURS: ${CLOUD_ENROLLMENT_TOKEN_TTL_HOURS:-72}
    expose:
      - "8000"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      SAVI_CLOUD_DOMAIN: ${SAVI_CLOUD_DOMAIN:?definir SAVI_CLOUD_DOMAIN en .env}
      ACME_EMAIL: ${ACME_EMAIL:?definir ACME_EMAIL en .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: savi_cloud
      PGDATABASE: savi_cloud
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
    volumes:
      - ./backup/backup.sh:/usr/local/bin/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    networks: [internal]

networks:
  internal:

volumes:
  db_data:
  caddy_data:
  caddy_config:
